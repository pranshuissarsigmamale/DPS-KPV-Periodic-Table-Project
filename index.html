<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table Ultimate</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Interactive Periodic Table</h1>

<div class="controls">
  <input id="search" placeholder="Search element...">
</div>

<div id="table"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close">&times;</span>
    <h2 id="title"></h2>
    <div id="content"></div>
  </div>
</div>

<!-- HOVER -->
<div id="hoverCard" class="hover-card"></div>

<!-- MAP -->
<div id="mapPanel" class="map-panel">
  <div class="map-box">
    <button id="closeMap">✖</button>
    <h2 id="mapTitle"></h2>
    <div id="mapContent"></div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
