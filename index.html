<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table App</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>⚛️ Periodic Table</h1>

<input type="text" id="search" placeholder="Search element...">

<div id="table"></div>

<!-- HOVER CARD -->
<div id="hoverCard"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <span id="close">&times;</span>
    <h2 id="title"></h2>
    <div id="content"></div>
    <div id="atom"></div>
    <div id="uses"></div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
