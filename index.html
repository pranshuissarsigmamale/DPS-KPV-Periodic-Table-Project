<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Periodic Table</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Interactive Periodic Table</h1>

<div id="legend">
  <span class="alkali">Alkali</span>
  <span class="alkaline">Alkaline</span>
  <span class="transition">Transition</span>
  <span class="metalloid">Metalloid</span>
  <span class="nonmetal">Non-metal</span>
  <span class="halogen">Halogen</span>
  <span class="noble">Noble Gas</span>
</div>

<div id="table"></div>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close-btn">&times;</span>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
