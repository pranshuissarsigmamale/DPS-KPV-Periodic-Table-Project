<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Periodic Table</h1>

<div class="controls">
  <input id="search" placeholder="Search element...">
  <button id="quizBtn">🧠 Quiz</button>
</div>

<div id="table"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close">&times;</span>
    <h2 id="title"></h2>
    <div id="content"></div>
  </div>
</div>

<!-- QUIZ -->
<div id="quizPanel" class="quiz-panel">
  <div class="quiz-box">
    <button id="closeQuiz">✖</button>
    <h2>Quiz</h2>
    <div id="quiz"></div>
    <button onclick="checkAnswers()">Submit</button>
    <button onclick="loadQuiz()">Reset</button>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
