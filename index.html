<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>

<!-- IMPORTANT: relative paths for GitHub -->
<link rel="stylesheet" href="./style.css">
</head>

<body>

<h1>Interactive Periodic Table</h1>

<div class="controls">
  <button id="themeToggle">🌙 Toggle Theme</button>
  <input type="text" id="search" placeholder="Search element...">
</div>

<div id="legend">
  <span class="box alkali">Alkali</span>
  <span class="box alkaline">Alkaline</span>
  <span class="box transition">Transition</span>
  <span class="box metalloid">Metalloid</span>
  <span class="box nonmetal">Non-metal</span>
  <span class="box halogen">Halogen</span>
  <span class="box noble">Noble Gas</span>
  <span class="box lanthanoid">Lanthanoid</span>
  <span class="box actinoid">Actinoid</span>
</div>

<div id="table"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close">&times;</span>
    <h2 id="title"></h2>
    <div id="content"></div>
  </div>
</div>

<script src="./script.js" defer></script>
</body>
</html>
